services:
  api:
    image: ${API_IMAGE:-cardstack-api}
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      # TODO(auth-backend): Pass backend-only Clerk config here or through
      # Doppler: CLERK_SECRET_KEY, optional CLERK_JWT_KEY, and optional
      # CLERK_AUTHORIZED_PARTIES. Do not expose these values to the iOS bundle.
