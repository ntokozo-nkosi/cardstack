[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardstack-api"
version = "0.1.0"
description = "FastAPI backend for CardStack."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # TODO(auth-backend): Add clerk-backend-api for Clerk session token
    # verification, plus settings support if CLERK_SECRET_KEY,
    # CLERK_JWT_KEY, and authorized parties need structured parsing.
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
