name: Deploy Production to AWS ECS

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    uses: ./.github/workflows/aws-ecs-deploy-reusable.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: production
      role_arn: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
